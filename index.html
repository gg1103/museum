<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樓語 · 檔案 — Echoes of the Arcades</title>
<meta name="description" content="骑楼数字档案：八件浮雕，烛光扫过时浮出纹理。">
<meta name="theme-color" content="#080706">
<link rel="icon" href="favicon.png" sizes="128x128">
<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:title" content="樓語 · 檔案">
<meta property="og:description" content="骑楼数字档案：八件浮雕，烛光扫过时浮出纹理。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://gg1103.github.io/museum/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="gallery.css">
</head>
<body>

<canvas class="dust" id="dust" aria-hidden="true"></canvas>

<header class="bar">
  <span class="mark">
    <span class="mark-cn" data-bind="title">樓語</span>
    <span class="mark-sub">檔案</span>
  </span>
  <span class="hint"><i class="dot"></i>拖动旋转 · 滚动浏览</span>
</header>

<main>
  <div class="section-head">
    <h2 data-bind="sectionTitle">浮雕细部</h2>
    <span>共 <b id="count">08</b> 件</span>
  </div>

  <section class="grid" id="grid" aria-label="浮雕档案"></section>
</main>

<footer class="foot">
  <p class="arch-line" data-bind="archLine">骑楼数字档案</p>
  <p class="arch-meta">
    <span data-bind="footL"></span>
    <span data-bind="footR"></span>
  </p>
</footer>

<div class="warm" aria-hidden="true"></div>
<div class="candle" aria-hidden="true">
  <span class="glow"></span>
  <span class="wax"></span>
  <span class="flame"></span>
</div>

<script src="content.js"></script>
<script src="gallery.js"></script>
</body>
</html>
