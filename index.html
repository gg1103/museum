<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樓語 · 檔案 — Echoes of the Arcades</title>
<meta name="description" content="骑楼浮雕细部档案：八件浮雕，在烛光下依次显影。移动鼠标，光会跟着走。">
<meta name="theme-color" content="#080706">
<link rel="icon" href="favicon.png" sizes="128x128">
<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:title" content="樓語 · 檔案">
<meta property="og:description" content="八件骑楼浮雕，在烛光下依次显影。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://gg1103.github.io/museum/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="gallery.css">
</head>
<body>

<header class="bar">
  <a class="mark" href="index.html">
    <span class="mark-cn" data-bind="title">樓語</span>
    <span class="mark-sub">檔案</span>
  </a>
  <nav class="bar-nav">
    <button type="button" class="btn" id="litAll" aria-pressed="false">点亮全部</button>
  </nav>
</header>

<main>
  <section class="hero">
    <p class="eyebrow">Echoes of the Arcades · Relief Archive</p>
    <h1 data-bind="title">樓語</h1>
    <p class="en" data-bind="titleEn">Echoes of the Arcades</p>
    <p class="lead" data-bind="lead"></p>
    <p class="hint"><i class="dot"></i>移动鼠标，烛光会跟着走</p>
  </section>

  <div class="section-head">
    <h2 data-bind="sectionTitle">浮雕细部</h2>
    <span>共 <b id="count">08</b> 件</span>
  </div>

  <section class="grid" id="grid" aria-label="浮雕档案"></section>

  <footer class="foot">
    <span data-bind="footL"></span>
    <span data-bind="footR"></span>
  </footer>
</main>

<!-- 暗幕与烛光 -->
<div class="veil" aria-hidden="true"></div>
<div class="warm" aria-hidden="true"></div>
<div class="candle" aria-hidden="true">
  <span class="glow"></span>
  <span class="flame"></span>
</div>

<!-- 放大查看 -->
<div class="viewer" id="viewer" hidden>
  <div class="viewer-top">
    <span class="no" id="viewerNo"></span>
    <button type="button" class="btn" id="viewerClose">关闭 ✕</button>
  </div>
  <div class="viewer-stage" id="viewerStage"></div>
  <div class="viewer-bottom">
    <h3 id="viewerName"></h3>
    <p id="viewerNote"></p>
  </div>
</div>

<script src="content.js"></script>
<script src="gallery.js"></script>
</body>
</html>
