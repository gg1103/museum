<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樓語 · 檔案 — Echoes of the Arcades</title>
<meta name="description" content="八件骑楼浮雕，在烛光下依次显影。滚动切换，拖动旋转。">
<meta name="theme-color" content="#080706">
<link rel="icon" href="favicon.png" sizes="128x128">
<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:title" content="樓語 · 檔案">
<meta property="og:description" content="八件骑楼浮雕，在烛光下依次显影。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://gg1103.github.io/museum/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="gallery.css">
</head>
<body>

<header class="bar">
  <span class="mark">
    <span class="mark-cn" data-bind="title">樓語</span>
    <span class="mark-sub">檔案</span>
  </span>
  <span class="hint"><i class="dot"></i>滚轮切换 · 拖动旋转</span>
</header>

<main>
  <div class="rail" id="rail"></div>

  <div class="caption" id="caption">
    <span class="no" id="capNo">01</span>
    <h2 id="capName">—</h2>
    <p id="capNote">—</p>
  </div>

  <nav class="pager" id="pager" aria-label="切换浮雕"></nav>
</main>

<footer class="foot">
  <span data-bind="footL"></span>
  <span data-bind="footR"></span>
</footer>

<div class="veil" aria-hidden="true"></div>
<div class="warm" aria-hidden="true"></div>
<div class="candle" aria-hidden="true">
  <span class="glow"></span>
  <span class="wax"></span>
  <span class="flame"></span>
</div>

<script src="content.js"></script>
<script src="gallery.js"></script>
</body>
</html>
