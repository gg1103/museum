<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找不到这一页 — 樓語</title>
<link rel="icon" href="favicon.png" sizes="128x128">
<style>
  :root {
    --room: #080706;
    --ink: #f2ebdc;
    --dim: #bcb1a0;
    --muted: #8a8073;
    --flame: #ffb15e;
    --verm: #c4402b;
    --kai: "KaiTi", "STKaiti", "Kaiti SC", "SimSun", serif;
    --song: "Songti SC", "STSong", "SimSun", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 24px;
    padding: 40px;
    text-align: center;
    background: radial-gradient(140% 100% at 50% -10%, #17130c 0%, #0b0907 52%, #060504 100%);
    color: var(--ink);
    font-family: var(--song);
    cursor: default;
  }
  .code { font-family: Georgia, serif; font-size: 11px; letter-spacing: 0.44em; color: var(--muted); margin: 0; }
  .mark { font-family: var(--kai); font-size: 68px; letter-spacing: 0.1em; margin: 0; color: #f7f0e1; }
  .flame {
    width: 14px; height: 30px;
    border-radius: 50% 50% 46% 46% / 70% 70% 30% 30%;
    background: radial-gradient(circle at 50% 76%, #fffdf3 0%, #ffe9b0 26%, #ffbe63 54%, #ff8a2b 78%, rgba(255,110,30,0) 100%);
    box-shadow: 0 0 26px 9px rgba(255, 160, 70, 0.35);
  }
  p.lead { margin: 0; font-size: 14.5px; line-height: 2; color: var(--dim); max-width: 24em; letter-spacing: 0.06em; }
  a.back {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 26px; margin-top: 8px;
    border: 1px solid rgba(242, 235, 220, 0.24);
    color: var(--ink); text-decoration: none;
    font-size: 12.5px; letter-spacing: 0.24em;
    transition: background 0.3s, color 0.3s, border-color 0.3s;
  }
  a.back:hover { background: var(--flame); border-color: var(--flame); color: #17110b; }
</style>
</head>
<body>
  <p class="code">404</p>
  <h1 class="mark">樓語</h1>
  <span class="flame"></span>
  <p class="lead">这一页灭了。<br>也许链接抄错了，或者这一件还没有挂上来。</p>
  <a class="back" href="./">回到展厅</a>
</body>
</html>
